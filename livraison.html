<style>/* ==========================================================================
   SN2I — Cartographie clients · aliments de bétail
   Feuille de style unique. Aucune ressource externe : tout doit fonctionner
   hors ligne, sur un téléphone d'entrée de gamme, en plein soleil.

   Cette feuille porte la charte commune aux trois outils (formulaire de
   terrain, poste de phoning, console de pilotage). Les deux autres feuilles
   sont chargées APRÈS celle-ci et ne font que la compléter.
   ========================================================================== */

:root {
  /* ---- couleurs de marque ------------------------------------------- */
  --principal:        #442A19;
  --principal-clair:  #5C3A22;
  --principal-pale:   #F4EDE5;
  --accent:       #C79D67;
  --accent-pale:  #FBF4EA;
  --fond:        #FAF7F3;
  --carte:       #FFFFFF;
  --texte:       #2B1C10;
  --gris:        #7A6A5B;
  --bord:        #E6DCCF;

  /* ---- couleurs d'état, communes aux trois outils -------------------- */
  --rouge:       #B3261E;
  --rouge-pale:  #FCEBEA;
  --rouge-bord:  #E9BDB9;
  --vert:        #1F5A38;
  --vert-pale:   #E8F3EC;
  --vert-bord:   #BFDCCB;
  --bleu:        #1B4F8A;
  --bleu-pale:   #E7F0FB;
  --ambre:       #6B4A22;
  --ambre-pale:  #FEF6E4;

  /* ---- échelle d'espacement -----------------------------------------
     Une seule échelle pour les trois outils : 4 · 8 · 12 · 16 · 24 · 32.
     Toute marge ou tout écart doit se prendre dans cette liste.          */
  --e1: 4px;
  --e2: 8px;
  --e3: 12px;
  --e4: 16px;
  --e6: 24px;
  --e8: 32px;

  /* ---- rayons -------------------------------------------------------- */
  --rayon:    14px;  /* cartes et blocs                                   */
  --rayon-m:  12px;  /* boutons, zones de saisie hautes                   */
  --rayon-s:  10px;  /* contrôles courts, vignettes, encarts              */

  /* ---- hauteurs de contrôle -----------------------------------------
     48 px est le minimum confortable pour un pouce sur téléphone.        */
  --h-champ: 48px;   /* champ de saisie, bouton de choix                  */
  --h-btn:   52px;   /* bouton d'action pleine largeur                    */
  --h-mini:  40px;   /* contrôle secondaire, de tableau ou de barre       */
  --h-barre: 84px;   /* barre d'onglets inférieure du formulaire          */

  /* ---- ombres et anneaux de focus ------------------------------------ */
  --ombre:       0 1px 3px rgba(68,42,25,.10), 0 4px 14px rgba(68,42,25,.06);
  --ombre-forte: 0 4px 10px rgba(68,42,25,.14), 0 12px 28px rgba(68,42,25,.10);
  --ombre-basse: 0 1px 2px rgba(68,42,25,.08);
  --anneau:       0 0 0 3px rgba(199,157,103,.55);
  --anneau-rouge: 0 0 0 3px rgba(179,38,30,.22);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0;
  background: var(--fond);
  color: var(--texte);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 16px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}

/* Aucun outil ne doit déborder latéralement, même sur un écran de 320 px.
   On ne met pas « overflow-x: hidden » sur html/body : cela désactiverait le
   maintien en haut (position: sticky) de l'en-tête. Le débordement est traité
   là où il naît — les tableaux, qui défilent dans leur propre cadre. */
html, body { max-width: 100%; }

body { padding-bottom: calc(var(--h-barre) + env(safe-area-inset-bottom)); }

/* Un seul anneau de focus pour les trois outils. */
:focus-visible { outline: none; box-shadow: var(--anneau); }

/* ------------------------------------------------------------- en-tête */

.entete {
  background: linear-gradient(135deg, var(--principal) 0%, var(--principal-clair) 100%);
  color: #fff;
  padding: var(--e3) var(--e4) var(--e4);
  position: sticky; top: 0; z-index: 20;
  box-shadow: 0 2px 12px rgba(68,42,25,.22);
}

.entete-ligne { display: flex; align-items: center; gap: var(--e3); }

.bloc-marque {
  background: #fff; border-radius: var(--rayon-s); padding: var(--e1) var(--e2);
  display: flex; align-items: center; justify-content: center;
  min-width: 76px; height: 44px; flex: 0 0 auto;
}
.bloc-marque img { max-height: 32px; max-width: 116px; display: block; }
.bloc-marque .marque-texte {
  font-weight: 800; font-size: 22px; letter-spacing: .5px; color: var(--principal); line-height: 1;
}
.bloc-marque .marque-texte span { color: var(--accent); }

.entete-titres { min-width: 0; }
.entete h1 { font-size: 16px; margin: 0; font-weight: 700; letter-spacing: .2px; line-height: 1.3; }
.entete p { margin: var(--e1) 0 0; font-size: 12px; color: #E8DCCB; line-height: 1.35; }

.entete-bandeau { margin-top: var(--e3); display: flex; gap: var(--e2); flex-wrap: wrap; }

.puce {
  background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.20);
  border-radius: 999px; padding: var(--e1) var(--e3); font-size: 12px; font-weight: 600;
  display: inline-flex; align-items: center; gap: var(--e1);
  min-height: 26px; line-height: 1.4;
}
.puce b { color: #FFFFFF; }   /* 08/10/2026 : lisible en plein soleil (2,7:1 avant) */
.puce.hors-ligne { background: rgba(247,174,23,.22); border-color: rgba(247,174,23,.5); }

/* --------------------------------------------------------------- écrans */

.ecran {
  display: none;
  padding: var(--e4) var(--e4) var(--e6);
  max-width: 720px; margin: 0 auto;
}
.ecran.actif { display: block; }

.titre-section {
  display: flex; align-items: center; gap: var(--e2);
  margin: var(--e6) 0 var(--e3); font-size: 13px; font-weight: 800;
  text-transform: uppercase; letter-spacing: .7px; color: var(--principal);
}
.titre-section:first-child { margin-top: var(--e1); }
.titre-section .num {
  width: 24px; height: 24px; border-radius: 50%; background: var(--accent);
  color: var(--principal); font-size: 12px; font-weight: 800;
  display: flex; align-items: center; justify-content: center; flex: 0 0 auto;
}
.titre-section .filet { flex: 1; height: 1px; background: var(--bord); }

.carte {
  background: var(--carte); border: 1px solid var(--bord);
  border-radius: var(--rayon); padding: var(--e4); box-shadow: var(--ombre);
  margin-bottom: var(--e3);
}
.carte:last-child { margin-bottom: 0; }
.carte.aide { background: var(--accent-pale); border-color: #E8D3B4; font-size: 13px; color: var(--ambre); }

/* ------------------------------------------------- titres et textes courants
   Ces trois classes remplacent les styles écrits dans les balises : un seul
   endroit décide de la taille, de la couleur et de la marge, pour les trois
   outils à la fois. */

/* 18 px : c'est la taille de titre d'écran des trois outils. */
.titre-ecran {
  margin: 0 0 var(--e1); font-size: 18px; line-height: 1.3;
  font-weight: 700; color: var(--principal);
}
.sous-ecran {
  margin: 0 0 var(--e4); font-size: 12.5px; color: var(--gris); line-height: 1.5;
}
.texte-bloc {
  margin: 0 0 var(--e3); font-size: 13.5px; color: var(--gris); line-height: 1.55;
}
.texte-bloc:last-child { margin-bottom: 0; }

/* Écart d'un cran, pris dans l'échelle, quand un bloc doit se détacher. */
.espace { margin-top: var(--e4); }

/* ---------------------------------------------------------------- champs */

.champ { margin-bottom: var(--e4); }
.champ:last-child { margin-bottom: 0; }

label.intitule {
  display: block; font-size: 13px; font-weight: 700;
  margin-bottom: var(--e2); color: var(--principal); letter-spacing: .2px;
}
.req { color: var(--rouge); font-weight: 700; }
label.intitule .req { margin-left: 2px; }
.aide-champ {
  font-size: 12px; color: var(--gris); margin-top: var(--e2);
  display: block; line-height: 1.45;
}

input[type="text"], input[type="tel"], input[type="number"], input[type="date"],
input[type="password"], input[type="search"], textarea, select {
  width: 100%; padding: var(--e3) var(--e3); font-size: 16px; font-family: inherit;
  color: var(--texte); background: #fff;
  border: 1.5px solid var(--bord); border-radius: var(--rayon-m);
  outline: none; transition: border-color .15s, box-shadow .15s, background-color .15s;
  min-height: var(--h-champ);
}
input:hover:not(:disabled), textarea:hover:not(:disabled), select:hover:not(:disabled) {
  border-color: #D8C9B4;
}
input:focus, textarea:focus, select:focus {
  border-color: var(--principal); box-shadow: var(--anneau);
}
input:disabled, textarea:disabled, select:disabled {
  background: var(--principal-pale); color: var(--gris); cursor: not-allowed;
}
input.erreur, textarea.erreur, select.erreur {
  border-color: var(--rouge); background: var(--rouge-pale);
}
input.erreur:focus, textarea.erreur:focus, select.erreur:focus {
  border-color: var(--rouge); box-shadow: var(--anneau-rouge);
}
textarea { min-height: 96px; resize: vertical; line-height: 1.5; }
select { appearance: none; -webkit-appearance: none; padding-right: var(--e8); background-image:
  linear-gradient(45deg, transparent 50%, var(--gris) 50%),
  linear-gradient(135deg, var(--gris) 50%, transparent 50%);
  background-position: calc(100% - 18px) calc(50% + 1px), calc(100% - 13px) calc(50% + 1px);
  background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
}

.ligne-champs { display: flex; gap: var(--e3); }
.ligne-champs > * { flex: 1; min-width: 0; }
.ligne-champs > .large { flex: 2; }

/* boutons de choix (zone, catégorie, oui/non) */
.choix { display: flex; gap: var(--e2); flex-wrap: wrap; }
.choix input { position: absolute; opacity: 0; pointer-events: none; }
.choix label {
  flex: 1 1 88px; text-align: center; padding: var(--e3) var(--e2); cursor: pointer;
  border: 1.5px solid var(--bord); border-radius: var(--rayon-m); background: #fff;
  font-size: 15px; font-weight: 600; color: var(--gris);
  min-height: var(--h-champ); display: flex; align-items: center; justify-content: center;
  gap: var(--e1); transition: border-color .15s, background-color .15s, color .15s;
}
.choix input:checked + label {
  border-color: var(--principal); background: var(--principal); color: #fff;
  box-shadow: 0 2px 8px rgba(68,42,25,.25);
}
.choix input:focus-visible + label { box-shadow: var(--anneau); }

/* produits */
.produit {
  display: flex; align-items: center; gap: var(--e3);
  padding: var(--e3) 0; border-bottom: 1px dashed var(--bord);
}
.produit:last-of-type { border-bottom: none; }
.produit .nom-produit { flex: 1; font-size: 15px; font-weight: 600; min-width: 0; }
.produit .nom-produit small {
  display: block; font-weight: 400; font-size: 12px; color: var(--gris);
  margin-top: 2px; line-height: 1.35;
}
.produit .saisie-kg { flex: 0 0 116px; position: relative; }
.produit .saisie-kg input { padding-right: var(--e8); text-align: right; font-weight: 700; }
.produit .saisie-kg::after {
  content: "kg"; position: absolute; right: var(--e3); top: 50%; transform: translateY(-50%);
  font-size: 12px; color: var(--gris); font-weight: 700; pointer-events: none;
}
.produit.mieux {
  background: var(--accent-pale); border-radius: var(--rayon-s);
  padding: var(--e3); margin: 0 calc(-1 * var(--e3));
}
.etoile {
  flex: 0 0 auto; border: 1.5px solid var(--bord); background: #fff; color: var(--gris);
  border-radius: var(--rayon-s); padding: 0 var(--e3); font-size: 14px; font-weight: 700;

.total-kg {

/* photo */

.apercu-photo .retirer {

.btn {

}
.btn-principal { background: var(--principal); color: #fff; box-shadow: 0 3px 10px rgba(68,42,25,.24); }

.btn-accent { background: var(--accent); color: var(--principal); box-shadow: 0 3px 10px rgba(199,157,103,.32); }
.btn-accent:active { background: #B98D57; box-shadow: var(--ombre-basse); }
.btn-secondaire { background: #fff; color: var(--principal); border-color: var(--principal); }
.btn-secondaire:active { background: var(--principal-pale); }
.btn-discret { background: transparent; color: var(--gris); border-color: var(--bord); }
.btn-discret:active { background: var(--principal-pale); }
.btn-danger { background: transparent; color: var(--rouge); border-color: var(--rouge-bord); }
.btn-danger:active { background: var(--rouge-pale); }

.btn:disabled, .btn[disabled] {

.duo { display: flex; gap: var(--e3); }

@media (hover: hover) {

  .btn-accent:hover:not(:disabled) { background: #D3AC7C; }

.fiche {

.fiche:active { border-color: var(--accent); }
.fiche .vignette {

.fiche .nom { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

}

.tag {

}

@media (hover: hover) {

.vide { text-align: center; padding: var(--e8) var(--e6); color: var(--gris); font-size: 14px; }

/* ----------------------------------------------------- détail / divers */

.filet-detail { border-top: 1px solid var(--bord); margin: var(--e3) 0; }
.detail-ligne {
  display: flex; justify-content: space-between; gap: var(--e3);

}

.avis {
  border-radius: var(--rayon-m); padding: var(--e3) var(--e4); font-size: 13.5px;

}

.avis-alerte { background: var(--rouge-pale); border-color: var(--rouge-bord); color: var(--rouge); }
.avis-ok { background: var(--vert-pale); border-color: var(--vert-bord); color: var(--vert); }

.bascule-toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(var(--h-barre) + var(--e3)); z-index: 60;
  background: var(--principal); color: #fff; padding: var(--e3) var(--e6); border-radius: 999px;
  font-size: 14px; font-weight: 600; box-shadow: 0 6px 20px rgba(68,42,25,.3);
  opacity: 0; pointer-events: none; transition: opacity .25s, bottom .25s;
  max-width: calc(100vw - var(--e8)); text-align: center;
}
.bascule-toast.visible { opacity: 1; bottom: calc(var(--h-barre) + var(--e6)); }

/* ------------------------------------------------------- grands écrans */

@media (min-width: 620px) {
  .ecran { padding: var(--e6) var(--e6) var(--e8); }
  .choix label { flex: 1 1 auto; }
}

/* Sur ordinateur, la colonne de 720 px — juste pour un téléphone — paraît
   étroite au milieu d'un écran vide. On l'élargit d'un cran, sans aller plus
   loin : au-delà, les intitulés s'éloignent trop de leur champ et le
   formulaire devient moins sûr à remplir. Le poste de phoning ne suit pas
   cette règle, il la surcharge avec « .poste .ecran ». */
@media (min-width: 900px) {
  .ecran { max-width: 860px; padding: var(--e8) var(--e8); }
  .produit .saisie-kg { flex: 0 0 140px; }
  .stats { gap: var(--e3); }
}

/* ------------------------------------------------------------ très petits */

@media (max-width: 360px) {
  .ecran { padding: var(--e3) var(--e3) var(--e6); }
  .carte { padding: var(--e3); }
  .stats { gap: var(--e1); }
  .produit .saisie-kg { flex: 0 0 96px; }
}

/* ------------------------------------------------------------ impression */

@media print {
  :root { --ombre: none; --ombre-forte: none; --ombre-basse: none; }
  html, body { background: #fff; overflow: visible; }
  body { padding-bottom: 0; }
  .barre-basse, .entete, .bascule-toast { display: none !important; }
  .carte { box-shadow: none; border: 1px solid #C9BCA9; break-inside: avoid; }
  .ecran { max-width: none; padding: 0; }
  a[href^="tel:"] { color: inherit; text-decoration: none; }
}

<header class="tn-tete"><h1 id="tn_titre">Ma tournée</h1><p id="tn_sous">Chargement…</p></header>
<main class="tn-corps" id="tn_corps"><div class="tn-carte">Chargement…</div></main>
<!-- 09/10/2026 (0032) : le chauffeur dit ce qui ne va pas, sans compte, par son lien. -->
<section class="tn-avis" id="tn_avis" style="display:none">
  <button class="tn-btn" id="tn_avis_ouvrir" type="button">💬 Un problème ou une idée sur cette page ?</button>
  <div class="tn-carte" id="tn_avis_form" style="display:none">
    <div class="tn-genres">
      <button type="button" data-tn-genre="probleme">⚠️ Problème</button><button type="button" data-tn-genre="idee">💡 Idée</button>
      <button type="button" data-tn-genre="question">❓ Question</button><button type="button" data-tn-genre="bravo">👍 Ça marche</button>
    </div>
    <textarea class="tn-champ" id="tn_avis_texte" rows="4" maxlength="4000" placeholder="Ce qui ne va pas, ou ce qui manque"></textarea>
    <div id="tn_avis_msg"></div>
    <button class="tn-btn principal" id="tn_avis_envoyer" type="button">Envoyer à la logistique</button>
  </div>
</section>
<script>
var CONFIG_SN2I = { url: 'https://ynxjbsqkstfqsdunwofm.supabase.co', cle: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlueGpic3Frc3RmcXNkdW53b2ZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwNjY2ODksImV4cCI6MjEwNTY0MjY4OX0.wLlLlPpm9LWwohewWUcpJaF-HUhapE_pYZqyY-0Muq8' };
/* =====================================================================
   SN2I — La tournée du chauffeur (08/10/2026)
   Ouvert depuis le lien que la logistique envoie : …/livraison.html#j=JETON.
   Le jeton reste dans la partie « # » de l'adresse : le navigateur ne l'envoie
   jamais au serveur de la page. La page n'embarque AUCUNE donnée : elle demande
   à la base la tournée de CE lien (fonction tournee), et enregistre la remise
   signée (signer_livraison). Hors réseau, une remise signée est gardée sur le
   téléphone et repart seule dès que le réseau revient.
   ===================================================================== */
var CFG = CONFIG_SN2I;
var JETON = (location.hash.match(/j=([0-9a-f]{40,})/) || [])[1] || '';
var ETAT = { tournee: null, courant: null, etape: 1, saisie: {}, position: null };
var ATTENTE_CLE = 'sn2i_remises_attente';

function $(s) { return document.querySelector(s); }
function esc(t) { return String(t === null || t === undefined ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
function nb(v) { var n = parseFloat(v); return isFinite(n) ? n : 0; }
function fcfa(n) { return String(Math.round(nb(n))).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' FCFA'; }
function tel(t) { var c = String(t || '').replace(/\D/g, '').slice(-9); return c.length === 9 ? c.replace(/(\d{2})(\d{3})(\d{2})(\d{2})/, '$1 $2 $3 $4') : ''; }
function lireAttente() { try { return JSON.parse(localStorage.getItem(ATTENTE_CLE) || '[]'); } catch (e) { return []; } }
function ecrireAttente(l) { try { localStorage.setItem(ATTENTE_CLE, JSON.stringify(l)); } catch (e) { /* stockage indisponible */ } }

function rpc(nom, args) {
  return fetch(CFG.url + '/rest/v1/rpc/' + nom, {
    method: 'POST', headers: { 'apikey': CFG.cle, 'Authorization': 'Bearer ' + CFG.cle, 'Content-Type': 'application/json' },
    body: JSON.stringify(args)
  }).then(function (r) {
    return r.text().then(function (t) {
      var d = null; try { d = t ? JSON.parse(t) : null; } catch (e) { d = null; }
      if (!r.ok) { var e = new Error((d && d.message) || ('Erreur ' + r.status)); e.definitif = r.status < 500; throw e; }
      return d;
    });
  }, function () { var e = new Error('Pas de réseau'); e.reseau = true; throw e; });
}

function charger() {
  if (!JETON) {
    $('#tn_sous').textContent = '';
    $('#tn_corps').innerHTML = '<div class="tn-erreur">Ce lien est incomplet. Ouvrez le lien de tournée que la logistique vous a envoyé.</div>';
    return;
  }
  envoyerAttente();
  rpc('tournee', { p_jeton: JETON }).then(function (t) {
    ETAT.tournee = t;
    $('#tn_titre').textContent = 'Tournée de ' + (t.chauffeur || '');
    var faites = t.livraisons.filter(function (l) { return l.remise; }).length;
    $('#tn_sous').textContent = (t.societe && t.societe.raison_sociale || 'SN2I') + ' · ' + new Date(t.jour + 'T12:00:00Z').toLocaleDateString('fr-FR') +
      ' · ' + t.livraisons.length + ' livraison(s), ' + faites + ' remise(s)';
    afficherListe();
  }).catch(function (e) {
    $('#tn_sous').textContent = '';
    $('#tn_corps').innerHTML = '<div class="tn-erreur">' + esc(e.reseau ? 'Pas de réseau : la tournée s\'affichera dès qu\'il revient.' : e.message) + '</div>' +
      '<button class="tn-btn" onclick="charger()">Réessayer</button>';
  });
}

function afficherListe() {
  var att = lireAttente();
  var refusees = att.filter(function (a) { return a.erreur; });
  var html = refusees.length ? '<div class="tn-erreur"><b>' + refusees.length + ' remise(s) refusée(s) par le bureau</b> : ' +
    refusees.map(function (a) { return esc(a.erreur); }).join(' ; ') + '. Appelez la logistique : la signature est gardée sur ce téléphone.</div>' : '';
  html += att.length ? '<div class="tn-erreur">' + att.length + ' remise(s) signée(s) en attente d\'envoi : elles partent dès que le réseau revient.' +
    ' <button class="tn-btn" onclick="envoyerAttente(true)">Envoyer maintenant</button></div>' : '';
  if (!ETAT.tournee.livraisons.length) { html += '<div class="tn-carte">Aucune livraison dans votre tournée pour ce jour.</div>'; }
  ETAT.tournee.livraisons.forEach(function (l) {
    var enAttente = att.some(function (a) { return a.p.livraison_id === l.id; });
    html += '<div class="tn-carte"><h2>' + esc(l.client || 'Client') + '</h2>' +
      '<div class="tn-ligne">' + (l.remise ? '<span class="tn-statut fait">✓ remise signée · ' + esc(l.remise.numero_facture) + '</span>'
        : enAttente ? '<span class="tn-statut">signée, en attente d\'envoi</span>' : '<span class="tn-statut">à livrer</span>') +
        (l.creneau ? ' · ' + esc({ matin: 'matin', apres_midi: 'après-midi', soir: 'soir' }[l.creneau] || l.creneau) : '') + '</div>' +
      (l.repere ? '<div class="tn-ligne">📍 ' + esc(l.repere) + '</div>' : '') +
      '<div class="tn-ligne">' + l.lignes.map(function (x) { return esc(nb(x.quantite) + ' ' + x.unite + ' ' + x.designation); }).join(' · ') + '</div>' +
      (l.montant && !l.remise ? '<div class="tn-ligne"><b>' + fcfa(l.montant) + '</b> à encaisser</div>' : '') +
      (tel(l.telephone) ? '<a class="tn-appel" href="tel:+221' + String(l.telephone).replace(/\D/g, '').slice(-9) + '">📞 ' + esc(tel(l.telephone)) + '</a>' : '') +
      (l.latitude ? '<a class="tn-btn" style="display:block;text-align:center;line-height:52px;text-decoration:none" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=' +
        l.latitude + ',' + l.longitude + '">🗺 Itinéraire</a>' : '') +
      (!l.remise && !enAttente ? '<button class="tn-btn principal" data-remettre="' + esc(l.id) + '">✍ Remettre et faire signer</button>' : '') +
      '</div>';
  });
  $('#tn_corps').innerHTML = html;
  document.querySelectorAll('[data-remettre]').forEach(function (b) { b.onclick = function () { ouvrirRemise(b.dataset.remettre); }; });
}

function releverPosition() {
  ETAT.position = null;
  if (!navigator.geolocation) { return; }
  navigator.geolocation.getCurrentPosition(function (p) {
    ETAT.position = { lat: p.coords.latitude, lng: p.coords.longitude, precision: p.coords.accuracy };
  }, function () { ETAT.position = { refus: true }; }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
}

function ouvrirRemise(id) {
  ETAT.courant = ETAT.tournee.livraisons.filter(function (l) { return l.id === id; })[0];
  ETAT.etape = 1;
  ETAT.saisie = { qte: ETAT.courant.qte_commandee, bl: '', recu: '', nom: '', sigClient: '', sigChauffeur: '', observations: '' };
  releverPosition();
  etape();
}

function bandeauEtapes() {
  return '<ol class="tn-etapes">' + ['Quantités', 'Client signe', 'Chauffeur signe', 'Envoi'].map(function (x, i) {
    return '<li class="' + (ETAT.etape === i + 1 ? 'actif' : '') + '">' + (i + 1) + '. ' + x + '</li>';
  }).join('') + '</ol>';
}

function etape() {
  var l = ETAT.courant, s = ETAT.saisie, html = '';
  if (ETAT.etape === 1) {
    html = '<div class="tn-carte"><h2>' + esc(l.client) + '</h2>' +
      '<table class="tn-tableau"><tr><th>Produit</th><th class="num">Qté</th><th class="num">Montant</th></tr>' +
      l.lignes.map(function (x) { return '<tr><td>' + esc(x.designation) + '</td><td class="num">' + esc(nb(x.quantite) + ' ' + x.unite) + '</td><td class="num">' + (x.montant ? fcfa(x.montant) : '—') + '</td></tr>'; }).join('') +
      '<tr><td><b>Total</b></td><td class="num"><b>' + esc(nb(l.qte_commandee)) + '</b></td><td class="num"><b>' + (l.montant ? fcfa(l.montant) : '—') + '</b></td></tr></table>' +
      '<label class="tn-etiquette">N° du BL papier de l\'entrepôt *</label><input class="tn-champ" id="tn_bl" value="' + esc(s.bl) + '" placeholder="Écrit sur le bon papier">' +
      '<label class="tn-etiquette">Quantité livrée (unités) *</label><input class="tn-champ" id="tn_qte" inputmode="numeric" value="' + esc(s.qte) + '">' +
      '<div class="tn-aide">Moins que commandé ? Le reste repart au dispatch pour une prochaine livraison.</div>' +
      '<label class="tn-etiquette">Argent reçu maintenant (FCFA)</label><input class="tn-champ" id="tn_recu" inputmode="numeric" value="' + esc(s.recu) + '" placeholder="0 si rien reçu">' +
      '<label class="tn-etiquette">Remarque</label><input class="tn-champ" id="tn_obs" value="' + esc(s.observations) + '" placeholder="Facultatif">' +
      '<div id="tn_msg"></div><button class="tn-btn principal" id="tn_suiv">Suivant : signature du client →</button>' +
      '<button class="tn-btn" onclick="afficherListe()">← Retour à la tournée</button></div>';
  } else if (ETAT.etape === 2 || ETAT.etape === 3) {
    var client = ETAT.etape === 2;
    html = '<div class="tn-carte"><h2>' + (client ? 'Signature du client' : 'Signature du chauffeur') + '</h2>' +
      '<div class="tn-aide">' + (client ? 'Le client reconnaît avoir reçu ' + esc(s.qte) + ' unité(s)' + (l.montant ? ' pour un montant de ' + fcfa(l.montant * nb(s.qte) / Math.max(1, nb(l.qte_commandee))) : '') + '.'
        : 'Le chauffeur ' + esc(ETAT.tournee.chauffeur) + ' certifie la remise.') + '</div>' +
      (client ? '<label class="tn-etiquette">Nom de la personne qui signe *</label><input class="tn-champ" id="tn_nom" value="' + esc(s.nom) + '">' : '') +
      '<label class="tn-etiquette">Signez dans le cadre</label><canvas class="tn-signature" id="tn_pad"></canvas>' +
      '<button class="tn-btn" id="tn_effacer">Effacer et recommencer</button><div id="tn_msg"></div>' +
      '<button class="tn-btn principal" id="tn_suiv">' + (client ? 'Suivant : signature du chauffeur →' : 'Suivant : vérifier et envoyer →') + '</button>' +
      '<button class="tn-btn" id="tn_prec">← Étape précédente</button></div>';
  } else {
    html = '<div class="tn-carte"><h2>Vérifier et envoyer</h2>' +
      '<div class="tn-ligne">Client : <b>' + esc(l.client) + '</b> — signé par ' + esc(s.nom) + '</div>' +
      '<div class="tn-ligne">BL papier : <b>' + esc(s.bl) + '</b> · ' + esc(s.qte) + ' unité(s) livrée(s) sur ' + esc(nb(l.qte_commandee)) + '</div>' +
      '<div class="tn-ligne">Argent reçu : <b>' + (nb(s.recu) ? fcfa(s.recu) : 'rien') + '</b></div>' +
      '<div class="tn-ligne">Position : <span id="tn_pos">' + textePosition() + '</span></div>' +
      '<div id="tn_msg"></div><button class="tn-btn principal" id="tn_envoyer">✓ Enregistrer la remise signée</button>' +
      '<button class="tn-btn" id="tn_prec">← Étape précédente</button></div>';
  }
  $('#tn_corps').innerHTML = bandeauEtapes() + html;
  window.scrollTo(0, 0);
  if (ETAT.etape === 1) {
    $('#tn_suiv').onclick = function () {
      s.bl = $('#tn_bl').value.trim(); s.qte = $('#tn_qte').value.replace(/[^\d.]/g, ''); s.recu = $('#tn_recu').value.replace(/\D/g, '');
      s.observations = $('#tn_obs').value.trim();
      if (s.bl.length < 2) { return erreur('Écrivez le numéro du BL papier de l\'entrepôt.'); }
      if (!nb(s.qte) || nb(s.qte) > nb(l.qte_commandee)) { return erreur('Quantité livrée : entre 1 et ' + nb(l.qte_commandee) + '.'); }
      if (l.montant && nb(s.recu) > nb(l.montant)) { return erreur('Montant reçu supérieur au montant de la livraison.'); }
      ETAT.etape = 2; etape();
    };
  } else if (ETAT.etape === 2 || ETAT.etape === 3) {
    var pad = brancherSignature($('#tn_pad'));
    $('#tn_effacer').onclick = pad.effacer;
    $('#tn_prec').onclick = function () { ETAT.etape -= 1; etape(); };
    $('#tn_suiv').onclick = function () {
      if (ETAT.etape === 2) { s.nom = $('#tn_nom').value.trim(); if (s.nom.length < 2) { return erreur('Écrivez le nom de la personne qui signe.'); } }
      if (!pad.signe()) { return erreur('Faites signer dans le cadre.'); }
      if (ETAT.etape === 2) { s.sigClient = pad.image(); } else { s.sigChauffeur = pad.image(); }
      ETAT.etape += 1; etape();
    };
  } else {
    var maj = setInterval(function () { if ($('#tn_pos')) { $('#tn_pos').textContent = textePosition(); } else { clearInterval(maj); } }, 1500);
    $('#tn_prec').onclick = function () { ETAT.etape = 3; etape(); };
    $('#tn_envoyer').onclick = envoyerRemise;
  }
}
function textePosition() {
  var p = ETAT.position;
  return !p ? 'recherche du signal…' : p.refus ? 'non relevée (localisation refusée)' : 'relevée à ± ' + Math.round(p.precision) + ' m';
}
function erreur(m) { $('#tn_msg').innerHTML = '<div class="tn-erreur">' + esc(m) + '</div>'; }

function brancherSignature(c) {
  var r = c.getBoundingClientRect(), echelle = window.devicePixelRatio || 1;
  c.width = r.width * echelle; c.height = r.height * echelle;
  var x = c.getContext('2d'); x.scale(echelle, echelle);
  x.lineWidth = 2.5; x.lineCap = 'round'; x.strokeStyle = '#1a1a1a';
  var dessine = false, traits = 0;
  function point(e) { var b = c.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; }
  c.onpointerdown = function (e) { dessine = true; c.setPointerCapture(e.pointerId); var p = point(e); x.beginPath(); x.moveTo(p[0], p[1]); };
  c.onpointermove = function (e) { if (!dessine) { return; } var p = point(e); x.lineTo(p[0], p[1]); x.stroke(); traits++; };
  c.onpointerup = c.onpointercancel = function () { dessine = false; };
  return {
    effacer: function () { x.clearRect(0, 0, c.width, c.height); traits = 0; },
    signe: function () { return traits > 8; },
    image: function () { return c.toDataURL('image/png').split(',')[1]; }
  };
}

function chargeRemise() {
  var s = ETAT.saisie, p = ETAT.position || {};
  return { livraison_id: ETAT.courant.id, bl_papier: s.bl, qte_livree: s.qte, montant_recu: s.recu || null, nom_client: s.nom,
           signature_client: s.sigClient, signature_chauffeur: s.sigChauffeur, observations: s.observations || null,
           latitude: p.lat || null, longitude: p.lng || null, precision_m: p.precision || null,
           appareil: (navigator.userAgent || '').slice(0, 150) };
}

function envoyerRemise() {
  var b = $('#tn_envoyer'); b.disabled = true; b.textContent = 'Envoi…';
  var attendre = ETAT.position ? Promise.resolve() : new Promise(function (r) { setTimeout(r, 8000); });   // le GPS a 8 s de plus
  attendre.then(function () {
    var charge = chargeRemise();
    return rpc('signer_livraison', { p_jeton: JETON, p: charge }).then(function (r) {
      $('#tn_corps').innerHTML = '<div class="tn-ok"><b>Remise enregistrée : ' + esc(r.numero_facture || '') + '.</b><br>' +
        'Le bon de livraison et la facture de livraison signés sont au bureau.' + (r.reliquat ? '<br>Le reste repart au dispatch (' + esc(r.reliquat) + ').' : '') +
        '</div><button class="tn-btn principal" onclick="charger()">Retour à la tournée</button>';
    }).catch(function (e) {
      if (e.reseau || !e.definitif) {
        var att = lireAttente(); att.push({ p: charge, le: new Date().toISOString() }); ecrireAttente(att);
        $('#tn_corps').innerHTML = '<div class="tn-erreur"><b>Pas de réseau : la remise signée est gardée sur ce téléphone.</b><br>' +
          'Elle partira seule dès que le réseau revient. Ne fermez pas cette page tant qu\'elle n\'est pas partie.</div>' +
          '<button class="tn-btn principal" onclick="afficherListe()">Retour à la tournée</button>';
      } else { b.disabled = false; b.textContent = '✓ Enregistrer la remise signée'; erreur(e.message); }
    });
  });
}

function envoyerAttente(montrer) {
  var att = lireAttente(); if (!att.length) { return; }
  var restant = [];
  att.reduce(function (suite, a) {
    return suite.then(function () {
      /* Une remise refusée par la base n'est jamais jetée : elle reste, avec le motif, pour la logistique. */
      return rpc('signer_livraison', { p_jeton: JETON, p: a.p }).catch(function (e) { a.erreur = e.reseau ? '' : e.message; restant.push(a); });
    });
  }, Promise.resolve()).then(function () {
    ecrireAttente(restant);
    if (montrer) { charger(); }
  });
}
var AVIS_GENRE = null;
function brancherAvis() {
  if (!JETON) { return; }
  $('#tn_avis').style.display = '';
  $('#tn_avis_ouvrir').onclick = function () { $('#tn_avis_form').style.display = ''; this.style.display = 'none'; $('#tn_avis_texte').focus(); };
  document.querySelectorAll('[data-tn-genre]').forEach(function (b) {
    b.onclick = function () {
      AVIS_GENRE = b.dataset.tnGenre;
      document.querySelectorAll('[data-tn-genre]').forEach(function (x) { x.classList.toggle('actif', x === b); });
    };
  });
  $('#tn_avis_envoyer').onclick = function () {
    var texte = $('#tn_avis_texte').value.trim(), b = this, msg = $('#tn_avis_msg');
    if (!AVIS_GENRE) { msg.innerHTML = '<div class="tn-erreur">Choisissez : problème, idée, question ou « ça marche ».</div>'; return; }
    if (texte.length < 3) { msg.innerHTML = '<div class="tn-erreur">Écrivez quelques mots.</div>'; return; }
    b.disabled = true;
    rpc('deposer_retour_tournee', { p_jeton: JETON, p: { genre: AVIS_GENRE, texte: texte,
      contexte: { ecran: window.innerWidth + '×' + window.innerHeight, navigateur: (navigator.userAgent || '').slice(0, 200),
                  etape: ETAT.courant ? ETAT.etape : null, livraison: ETAT.courant ? ETAT.courant.numero : null } } })
      .then(function (r) {
        $('#tn_avis_texte').value = ''; AVIS_GENRE = null;
        document.querySelectorAll('[data-tn-genre]').forEach(function (x) { x.classList.remove('actif'); });
        msg.innerHTML = '<div class="tn-ok">Merci, retour ' + esc(r.numero) + ' envoyé.</div>';
      })
      .catch(function (e) { msg.innerHTML = '<div class="tn-erreur">Non envoyé : ' + esc(e.message) + ' Réessayez.</div>'; })
      .then(function () { b.disabled = false; });
  };
}
brancherAvis();
window.addEventListener('online', function () { envoyerAttente(true); });
setInterval(function () { if (navigator.onLine) { envoyerAttente(false); } }, 30000);
charger();
</script>
</body>
</html>
